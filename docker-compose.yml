services:
  db:
    image: postgres:17
    container_name: va-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: veteran_achieve
    ports:
      # 5433 di host supaya tidak bentrok dengan Postgres lokal di 5432
      - "5433:5432"
    volumes:
      - va_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d veteran_achieve"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  va_pgdata:
